<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050B1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Exam Countdown</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --blue:#0A84FF; --orange:#FF9F0A; --red:#FF453A; --green:#30D158;
    --text:rgba(255,255,255,.96); --muted:rgba(235,240,255,.62);
    --glass:rgba(255,255,255,.09); --glass-2:rgba(255,255,255,.14);
    --stroke:rgba(255,255,255,.22);
    --accent:var(--blue);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{min-height:100%;background:#050B1F linear-gradient(160deg,#050B1F 0%,#0A1F63 55%,#0B3CA8 100%) no-repeat}
  body{
    min-height:100vh; min-height:100dvh; color:var(--text); font-family:var(--font);
    -webkit-font-smoothing:antialiased; position:relative; overflow-x:hidden;
    padding:max(22px,env(safe-area-inset-top)) max(26px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(26px,env(safe-area-inset-left));
    display:flex; flex-direction:column; gap:20px;
  }
  /* soft colour blobs so the glass has something to blur */
  body::before,body::after{
    content:""; position:fixed; border-radius:50%; opacity:.5; z-index:0; pointer-events:none;
  }
  body::before{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,rgba(47,107,255,.9) 0%,rgba(47,107,255,0) 68%)}
  body::after{width:42vmax;height:42vmax;right:-14vmax;bottom:-16vmax;background:radial-gradient(circle,rgba(123,92,255,.85) 0%,rgba(123,92,255,0) 68%)}
  body > *{position:relative;z-index:1}

  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid rgba(255,255,255,.85);outline-offset:3px}

  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border:1px solid var(--stroke);
    box-shadow:0 6px 18px rgba(2,8,30,.3), inset 0 1px 0 rgba(255,255,255,.25);
  }

  header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:2rem;font-weight:700;letter-spacing:-.02em}
  #today{font-size:1rem;color:var(--muted);margin-top:2px;font-weight:500}
  .streak{
    display:flex;align-items:center;gap:12px;border-radius:999px;padding:8px 8px 8px 20px;font-weight:600;font-size:1rem
  }
  .streak button{
    border:0;border-radius:999px;padding:11px 20px;font-weight:600;min-height:44px;
    background:rgba(255,255,255,.92);color:#0A1F63;
  }
  .streak button[aria-pressed="true"]{background:var(--green);color:#03270f}

  .quote{border-radius:28px;padding:26px 30px}
  .quote small{display:block;color:var(--muted);font-size:.95rem;margin-bottom:8px;font-weight:500}
  .quote p{font-size:clamp(1.4rem,3vw,2.3rem);line-height:1.22;font-weight:600;letter-spacing:-.02em;max-width:36ch}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;flex:1}
  .card{border-radius:30px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .card h2{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
  .card .sub{color:var(--muted);font-size:.98rem;margin-top:2px;font-weight:500}
  .badge{
    font-size:.8rem;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;
    background:var(--glass-2);border:1px solid var(--stroke);color:var(--muted)
  }
  .badge.custom{color:var(--green)}

  .ringwrap{position:relative;width:min(100%,230px);aspect-ratio:1;margin:4px auto 0}
  .ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
  .track{stroke:rgba(255,255,255,.14)}
  .prog{stroke:var(--accent)}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .n{font-size:clamp(3.6rem,7vw,4.8rem);font-weight:300;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
  .u{font-size:1rem;color:var(--muted);font-weight:500;margin-top:4px}

  .meta{text-align:center;color:var(--muted);font-size:.98rem;font-weight:500}
  .pct{text-align:center;color:var(--muted);font-size:.9rem}
  .stage{
    border-radius:18px;padding:13px 15px;font-size:1rem;line-height:1.4;
    background:var(--glass);border:1px solid var(--stroke)
  }
  .stage b{color:var(--accent);font-weight:700}
  .extras{display:flex;flex-direction:column;gap:6px;font-size:.95rem;color:var(--muted)}
  .extras div{display:flex;justify-content:space-between;gap:10px}
  .extras span:last-child{color:var(--text);font-weight:600;white-space:nowrap}
  .edit{
    margin-top:auto;align-self:center;background:var(--glass);border:1px solid var(--stroke);
    border-radius:999px;padding:11px 20px;color:var(--text);min-height:44px;font-weight:500
  }
  .edit:hover{background:var(--glass-2)}

  footer{color:var(--muted);font-size:.85rem;text-align:center;line-height:1.5}

  dialog{
    margin:auto;color:var(--text);border-radius:26px;padding:26px;width:min(92vw,380px);
    background:rgba(20,36,90,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border:1px solid var(--stroke);box-shadow:0 20px 60px rgba(0,0,0,.5)
  }
  dialog::backdrop{background:rgba(3,8,24,.55)}
  dialog h3{margin-bottom:14px;font-size:1.2rem}
  dialog input{
    width:100%;padding:13px;border-radius:14px;border:1px solid var(--stroke);
    background:rgba(255,255,255,.1);color:var(--text);font:inherit;color-scheme:dark
  }
  .row{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
  .row button{padding:11px 18px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass);min-height:44px}
  .row .save{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}

  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass,dialog{background:rgba(20,36,90,.85)}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Countdown</h1>
    <div id="today"></div>
  </div>
  <div class="streak glass">
    <span id="streakText">Streak: 0 days</span>
    <button id="checkBtn" aria-pressed="false">I studied today</button>
  </div>
</header>

<section class="quote glass" aria-live="polite">
  <small>Today's thought</small>
  <p id="quote"></p>
</section>

<main class="grid" id="grid"></main>

<footer>
  Expected dates follow past patterns. CAT 2026 is official. Tap Change date once a notification is out.
</footer>

<dialog id="dlg">
  <h3 id="dlgTitle">Change date</h3>
  <input type="date" id="dlgDate" aria-label="Exam date">
  <div class="row">
    <button id="dlgReset">Reset</button>
    <button id="dlgCancel">Cancel</button>
    <button id="dlgSave" class="save">Save</button>
  </div>
</dialog>

<script>
(function(){
  "use strict";

  // Prep window starts here (used only for the progress ring)
  var PREP_START = "2026-09-21";
  var R = 88, C = 2 * Math.PI * R;

  var EXAMS = [
    { id:"pgcet", name:"PGCET MBA 2027", sub:"Karnataka", date:"2027-06-13",
      extras:[{label:"Application opens (est.)", date:"2027-03-23"}] },
    { id:"cat", name:"CAT 2026", sub:"IIM Indore", date:"2026-11-29", official:true, trial:true,
      extras:[{label:"Registration closes", date:"2026-09-22"}] },
    { id:"upsc", name:"UPSC CSE 2028", sub:"Prelims", date:"2028-05-28",
      extras:[{label:"Mains starts", date:"2028-08-25"}] },
    { id:"rbi", name:"RBI Grade B 2028", sub:"Phase 1", date:"2028-06-10",
      extras:[{label:"Phase 2", date:"2028-07-22"}] },
    { id:"sbi", name:"SBI PO 2028", sub:"Prelims", date:"2028-07-29",
      extras:[{label:"Mains", date:"2028-09-09"}] }
  ];

  var QUOTES = [
    "Small hours, done daily, become a rank.",
    "You do not need a perfect day. You need a completed one.",
    "Today's revision is tomorrow's confidence.",
    "The exam date will not move. Your effort can.",
    "Discipline is choosing the syllabus over the scroll.",
    "One chapter finished beats ten planned.",
    "Consistency is quieter than motivation and far more powerful.",
    "Every mock test is a rehearsal, not a verdict.",
    "Start where you are. Study what is in front of you.",
    "Your future officer self is watching what you do today.",
    "Progress is a habit, not a mood.",
    "Difficult topics are just easy topics you have not revised twice.",
    "Sit down. Open the book. The rest follows.",
    "Slow days still count. Zero days do not.",
    "Read like it will be asked. Write like it will be checked.",
    "Comparison steals hours. Use them on your own notes.",
    "A tired mind still learns. Just take a short break first.",
    "The syllabus is big, but you only read one page at a time.",
    "Be so regular that luck has to notice you.",
    "Your only competition is who you were yesterday.",
    "Do the boring revision. That is where marks hide.",
    "Effort compounds like interest. Keep depositing.",
    "Do not count the days. Make the days count.",
    "Wake up with a plan. Sleep with a tick on it.",
    "Confidence is built at the desk, not on the exam day.",
    "Failure to a mock is feedback with a date on it.",
    "Fix one weak area today.",
    "Your notes are your weapons. Sharpen them.",
    "Quit the excuse, keep the schedule.",
    "Dreams need timetables.",
    "Three exams, one habit: show up.",
    "A focused hour beats a distracted day.",
    "Solve one more question than you planned.",
    "Every expert once struggled with the same chapter.",
    "Rest is part of the plan, not a break from it.",
    "Trust the process, then check the process.",
    "Hard now, proud later.",
    "You are closer than you were last week.",
    "Make today's target small enough to finish and big enough to matter.",
    "Answer writing improves only by writing answers.",
    "Current affairs are a daily bath, not a weekend flood.",
    "The best time to revise was yesterday. The next best is now.",
    "Phone away, pen out.",
    "Patience and practice win the long exams.",
    "Nobody remembers the tired days. They remember the result.",
    "Turn 'I should' into 'I did'.",
    "Let your routine carry you when motivation leaves.",
    "Your effort is invisible today and obvious on result day.",
    "Do not wait to feel ready. Get ready by starting.",
    "A clear timetable removes half of the stress.",
    "Every solved PYQ removes one surprise from the exam hall.",
    "Stay curious. Understanding beats memorising.",
    "Set the alarm, win the morning, win the day.",
    "Be serious about the goal and gentle with yourself.",
    "The distance between you and the goal is called daily work.",
    "Focus is a skill. Train it like the syllabus.",
    "Your background does not decide your rank. Your practice does.",
    "Keep going. Somebody has to get selected. Why not you?",
    "Each page you finish is a brick in the result.",
    "Clarity first, speed later.",
    "Revise the basics until they feel boring.",
    "Sleep well. A rested brain remembers more.",
    "Balance sheets balance because someone checked. Check your revision too.",
    "Turn every doubt into a topic to study.",
    "Aim for progress you can prove: pages, questions, tests.",
    "Show up on the days it is hard. Those count double.",
    "Do not chase perfect notes. Chase repeated revision.",
    "The path is long, but the next step is always small.",
    "Today's discomfort is tomorrow's discipline.",
    "Ask why. Answer it. Move on.",
    "Study like the vacancy is already yours.",
    "Keep a streak. Protect it.",
    "Set a timer, stay with one subject, finish the block.",
    "Mistakes in practice are cheaper than mistakes in the exam.",
    "Read the newspaper with a pen in hand.",
    "Your calm on exam day is built by mocks today.",
    "Choose a few good sources and finish them.",
    "Half done is not done. Close the loop.",
    "The toughest part is the first ten minutes. Get past them.",
    "Aspirants who revise more, regret less.",
    "Push a little harder than yesterday.",
    "Let the countdown push you, not scare you.",
    "Big goals are just small tasks with good manners.",
    "Watch your time like you watch your money.",
    "Stay hungry for marks, humble about gaps.",
    "The exam rewards the prepared, not the anxious.",
    "Your dream job is worth an uncomfortable year.",
    "Keep the goal on the wall and the phone in a drawer.",
    "A little every day is a lot by the exam day.",
    "Study now. Celebrate with your family later.",
    "Today, be the student your result will thank.",
    "Win the hour in front of you.",
    "Doubt is loud. Practice is louder.",
    "You have prepared for harder things than this.",
    "Sharpen accuracy first. Speed will follow.",
    "Turn the last page of the chapter before you close the book.",
    "Your effort today is a promise to your future self.",
    "Trade one hour of distraction for one hour of revision.",
    "Keep learning. Keep testing. Keep improving.",
    "The rank list has room for one more name. Make it yours.",
    "Go slow if you must, but do not go missing.",
    "Yesterday's revision is what you will thank yourself for tomorrow.",
    "Keep your head clear and your notes closer.",
    "Make the next hour count. Then the next.",
    "The finish line moves closer only if you move.",
    "Believe in the work you have already done."
  ];

  // ---------- storage (safe if blocked) ----------
  function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  var overrides = load("cd28_dates", {});
  var studied = load("cd_studied", []);

  // ---------- date helpers ----------
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function dayNum(s){ var p = s.split("-"); return Math.round(Date.UTC(+p[0], +p[1]-1, +p[2]) / 86400000); }
  function todayStr(){ return ymd(new Date()); }
  function fmt(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"});
  }
  function nf(n){ return n.toLocaleString("en-IN"); }

  function stageFor(d){
    if(d < 0)  return ["Done", "This exam has passed. Set the next date."];
    if(d === 0) return ["Exam day", "Breathe. Read the paper twice. You are ready."];
    if(d <= 7)  return ["Calm week", "Light revision, formula sheets, good sleep."];
    if(d <= 45) return ["Final sprint", "Full-length mocks, PYQs and error notebook."];
    if(d <= 120) return ["Revision mode", "Revise, don't start new books. Mock test every week."];
    if(d <= 240) return ["Practice mode", "Finish the syllabus, then test and write answers."];
    return ["Build the base", "Cover the syllabus one topic at a time."];
  }
  function accentFor(d){
    if(d <= 60) return "#FF453A";
    if(d <= 180) return "#FF9F0A";
    return "#0A84FF";
  }

  // ---------- render ----------
  var grid = document.getElementById("grid");
  function examDate(e){ return overrides[e.id] || e.date; }

  var lastDay = "";

  function renderStreak(){
    var t = todayStr(), tn = dayNum(t);
    var set = {}; studied.forEach(function(s){ set[s] = 1; });
    var cursor = set[t] ? tn : tn - 1, streak = 0;
    while(true){
      var dt = new Date(cursor * 86400000);
      var key = dt.getUTCFullYear() + "-" + pad(dt.getUTCMonth()+1) + "-" + pad(dt.getUTCDate());
      if(set[key]){ streak++; cursor--; } else break;
    }
    document.getElementById("streakText").textContent = "Streak: " + streak + (streak === 1 ? " day" : " days");
    var cb = document.getElementById("checkBtn");
    cb.setAttribute("aria-pressed", set[t] ? "true" : "false");
    cb.textContent = set[t] ? "Studied today" : "I studied today";
  }

  function render(){
    var t = todayStr(), tn = dayNum(t);
    lastDay = t;

    document.getElementById("today").textContent =
      new Date().toLocaleDateString("en-IN", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
    document.getElementById("quote").textContent = QUOTES[((tn % QUOTES.length) + QUOTES.length) % QUOTES.length];
    renderStreak();

    grid.innerHTML = "";
    EXAMS.forEach(function(e){
      var ds = examDate(e), d = dayNum(ds) - tn;
      var startN = dayNum(PREP_START), total = Math.max(1, dayNum(ds) - startN);
      var pct = Math.max(0, Math.min(100, Math.round(((tn - startN) / total) * 100)));
      var st = (e.trial && d > 30) ? ["Practice run", "Treat this as a trial attempt. Quant basics daily and a mock every 3-4 days."] : stageFor(d);
      var accent = accentFor(d);
      var offset = C * (1 - pct / 100);

      var card = document.createElement("article");
      card.className = "card glass";
      card.style.setProperty("--accent", accent);

      var extras = e.extras.map(function(x){
        var xd = dayNum(x.date) - tn;
        return "<div><span>" + x.label + ", " + fmt(x.date) + "</span><span>" +
               (xd >= 0 ? nf(xd) + " days" : "over") + "</span></div>";
      }).join("");

      var big = d >= 0 ? nf(d) : "0";
      var unit = d === 1 ? "day to go" : (d === 0 ? "today" : "days to go");
      var weeks = d > 0 ? Math.floor(d / 7) + " weeks " + (d % 7) + " days" : "";
      var custom = !!overrides[e.id];

      card.innerHTML =
        '<div class="top"><div><h2>' + e.name + '</h2><div class="sub">' + e.sub + ", " + fmt(ds) +
        '</div></div><span class="badge ' + (custom ? "custom" : "") + '">' + (custom ? "Custom date" : (e.official ? "Official date" : "Expected")) + '</span></div>' +
        '<div class="ringwrap" role="img" aria-label="' + e.name + ': ' + big + ' ' + unit + ', ' + pct + ' percent of prep time used">' +
          '<svg viewBox="0 0 200 200" aria-hidden="true">' +
            '<circle class="track" cx="100" cy="100" r="' + R + '" fill="none" stroke-width="14"/>' +
            '<circle class="prog" cx="100" cy="100" r="' + R + '" fill="none" stroke-width="14" stroke-linecap="round" ' +
              'stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '"/>' +
          '</svg>' +
          '<div class="center"><span class="n">' + big + '</span><span class="u">' + unit + '</span></div>' +
        '</div>' +
        '<div class="meta">' + (weeks ? weeks + " · " : "") + (d > 0 ? nf(d * 24) + " hours" : "") + '</div>' +
        '<div class="pct">' + pct + '% of prep time used</div>' +
        '<div class="stage"><b>' + st[0] + '.</b> ' + st[1] + '</div>' +
        '<div class="extras">' + extras + '</div>' +
        '<button class="edit" data-id="' + e.id + '">Change date</button>';
      grid.appendChild(card);
    });
  }

  // ---------- streak button ----------
  document.getElementById("checkBtn").addEventListener("click", function(){
    var t = todayStr(), i = studied.indexOf(t);
    if(i >= 0) studied.splice(i, 1); else studied.push(t);
    save("cd_studied", studied);
    renderStreak();
  });

  // ---------- edit dialog ----------
  var dlg = document.getElementById("dlg"), dlgDate = document.getElementById("dlgDate"), current = null;
  grid.addEventListener("click", function(ev){
    var b = ev.target.closest(".edit"); if(!b) return;
    current = EXAMS.filter(function(x){ return x.id === b.getAttribute("data-id"); })[0];
    document.getElementById("dlgTitle").textContent = current.name + " " + current.sub + " date";
    dlgDate.value = examDate(current);
    if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  });
  document.getElementById("dlgCancel").addEventListener("click", function(){ dlg.close(); });
  document.getElementById("dlgReset").addEventListener("click", function(){
    delete overrides[current.id]; save("cd28_dates", overrides); dlg.close(); render();
  });
  document.getElementById("dlgSave").addEventListener("click", function(){
    if(dlgDate.value){ overrides[current.id] = dlgDate.value; save("cd28_dates", overrides); }
    dlg.close(); render();
  });

  render();
  function tick(){ if(todayStr() !== lastDay) render(); }
  setInterval(tick, 60000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) tick(); });

  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
